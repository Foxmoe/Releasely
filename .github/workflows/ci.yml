name: CI

on:
  push:
    branches: [ main, my-update, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2g" -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: build/reports/tests/

  android:
    name: Android Build
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2g" -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android App
        run: ./gradlew -p releaselyapp build --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew -p releaselyapp assembleDebug --no-daemon

      - name: Assemble Release APK
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_STORE_FILE" ]; then
            echo "$RELEASE_STORE_FILE" | base64 -d > releaselyapp/releasely.keystore
            echo "RELEASE_STORE_FILE=releasely.keystore" >> releaselyapp/local.properties
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> releaselyapp/local.properties
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> releaselyapp/local.properties
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> releaselyapp/local.properties
            ./gradlew -p releaselyapp assembleRelease --no-daemon
          else
            echo "No release signing config found, skipping release build"
          fi

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: releasely-debug-apk
          path: releaselyapp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK artifact
        if: env.RELEASE_STORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: releasely-release-apk
          path: releaselyapp/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
